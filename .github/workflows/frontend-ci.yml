name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run Cypress E2E tests
        run: |
          npm run dev &
          npx wait-on http://localhost:3000
          npm run cy:run